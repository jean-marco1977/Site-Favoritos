<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação para exibir acentos corretamente -->
    <meta charset="UTF-8">
    <!-- Garante que a página seja responsiva no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título obrigatório que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>
    <style>
        /* Estilização moderna e limpa para valorizar o projeto */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; background-color: #eef2f3; }
        .titulo-principal { color: #2c3e50; margin-bottom: 40px; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .site-card { background: #ffffff; padding: 25px; margin-bottom: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        /* Tag h1 usada para o nome de cada site conforme exigido pelas dicas */
        h1 { color: #34495e; font-size: 1.8em; margin-top: 0; }
        img { max-width: 100%; height: auto; border: 2px solid #eaeded; border-radius: 8px; margin: 15px 0; transition: all 0.3s ease; }
        img:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        a { display: inline-block; color: #3498db; text-decoration: none; font-weight: bold; font-size: 1.1em; }
        a:hover { color: #2980b9; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Título principal do corpo da página - Lembre-se de substituir "Seu Nome" -->
    <div class="titulo-principal">
        <h2>Meus sites favoritos: Seu Nome</h2>
    </div>

    <!-- SITE 1: Google -->
    <div class="site-card">
        <h1>Google</h1> <!-- Nome do site ACIMA da imagem com h1 -->
        <!-- Link aplicado na imagem (Opcional solicitado) -->
        <a href="https://google.com" target="_blank">
            <img src="google.png" alt="Captura de tela do site Google">
        </a>
        <br>
        <!-- Link de texto ABAIXO da imagem -->
        <a href="https://google.com" target="_blank">Acessar o Google</a>
    </div>

    <!-- SITE 2: Wikipedia -->
    <div class="site-card">
        <h1>Wikipedia</h1>
        <a href="https://wikipedia.org" target="_blank">
            <img src="wikipedia.png" alt="Captura de tela do site Wikipedia">
        </a>
        <br>
        <a href="https://wikipedia.org" target="_blank">Acessar a Wikipedia</a>
    </div>

    <!-- SITE 3: GitHub -->
    <div class="site-card">
        <h1>GitHub</h1>
        <a href="https://github.com" target="_blank">
            <img src="github.png" alt="Captura de tela do site GitHub">
        </a>
        <br>
        <a href="https://github.com" target="_blank">Acessar o GitHub</a>
    </div>

    <!-- SITE 4: YouTube -->
    <div class="site-card">
        <h1>YouTube</h1>
        <a href="https://youtube.com" target="_blank">
            <img src="youtube.png" alt="Captura de tela do site YouTube">
        </a>
        <br>
        <a href="https://youtube.com" target="_blank">Acessar o YouTube</a>
    </div>

    <!-- SITE 5: Stack Overflow -->
    <div class="site-card">
        <h1>Stack Overflow</h1>
        <a href="https://stackoverflow.com" target="_blank">
            <img src="stackoverflow.png" alt="Captura de tela do site Stack Overflow">
        </a>
        <br>
        <a href="https://stackoverflow.com" target="_blank">Acessar o Stack Overflow</a>
    </div>

</body>
</html>
